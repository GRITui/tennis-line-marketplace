name: Copilot PR gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested, review_submitted]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  request-review:
    name: Request Copilot review
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot as reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          reviewer="copilot-pull-request-reviewer[bot]"
          requested="$(gh api "repos/${repo}/pulls/${PR_NUMBER}/requested_reviewers" --jq '.users[].login')"
          if printf '%s\n' "$requested" | grep -Fxq "$reviewer"; then
            echo "Copilot review is already requested."
            exit 0
          fi
          gh api \
            --method POST \
            "repos/${repo}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=${reviewer}"

  merge-when-gated:
    name: Merge when gated
    if: >
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate CI and Copilot approval
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            PR_NUMBER="$(gh pr list --repo "$repo" --state open --head "$WORKFLOW_HEAD_BRANCH" --json number --jq '.[0].number // empty')"
          fi
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No open pull request found; nothing to merge."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          checks="$(gh pr checks "$PR_NUMBER" --repo "$repo" --json name,state,bucket)"
          if jq -e 'any(.[]; .bucket == "fail" or .bucket == "pending")' >/dev/null <<<"$checks"; then
            echo "Required checks are not all successful."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reviews="$(gh api --paginate "repos/${repo}/pulls/${PR_NUMBER}/reviews")"
          copilot_state="$(jq -r '
            [.[] | select(.user.login == "copilot-pull-request-reviewer[bot]")] |
            sort_by(.submitted_at) | last | .state // "PENDING"
          ' <<<"$reviews")"
          if [ "$copilot_state" != "APPROVED" ]; then
            echo "Waiting for Copilot approval; current state: $copilot_state"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.gate.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch
